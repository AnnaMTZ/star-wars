<section class="content">

  <h1>Welcome to the Star Wars Universe!</h1>
  <h2>Check the episodes</h2>
  <div class="films-container">
    @for (film of films.value() ?? []; track film.url) {
      <div
        class="film-card"
        [routerLink]="['/episode', toSlug(film.title)]">
        <h2>{{ film.title }}</h2>
      </div>
    }
  </div>
</section>

@if (films.error()) {Failed to load films}
